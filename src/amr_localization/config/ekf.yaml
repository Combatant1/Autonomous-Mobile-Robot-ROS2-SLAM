# robot_localization EKF for the 4-wheel skid-steer AMR (planar, 2D).
#
# Fused inputs (state order: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az):
#   odom0 : forward velocity (vx) from the wheel encoders.
#           NOT x/y position (that is just vx integrated with the encoder heading, which
#           is wrong on a skid-steer), and NOT yaw rate (wheel slip makes it unreliable).
#   imu0  : yaw rate (vyaw) from the MPU6050 gyro.
#           NOT yaw: the MPU6050 has no magnetometer, so it provides no absolute heading.
#
# The values `odom0`, `publish_tf` and `use_sim_time` are overridden by
# local_localization.launch.py (arguments use_noisy_odom / ekf_publishes_tf / use_sim_time).
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: false          # see launch argument ekf_publishes_tf

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint   # same root as the URDF / diff_drive_controller
    world_frame: odom

    odom0: amr_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: imu/out
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10

    # process_noise_covariance / initial_estimate_covariance are intentionally omitted:
    # the matrices that were here were identical to robot_localization's defaults.
